org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 让 AGP 使用非传递 R 类，并开启资源/代码收缩所需的命名空间校验
android.nonFinalResIds=false

# ===== 并行构建必须关闭 =====
# assets/usrtar.zip 达 461MB，Gradle 8.11 在并行执行 :app:compressDebugAssets 与
# 其他任务时，会对该文件产生哈希读取竞态，报
#   "Cannot access output property 'outputDir' ... Failed to create MD5 hash for file content"
# 串行执行可稳定通过。若后续把大体积工具链改为首次启动下载，可重新开启并行。
org.gradle.parallel=false
org.gradle.workers.max=2
