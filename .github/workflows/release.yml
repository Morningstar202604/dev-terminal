name: Release APK

# 推送 v* tag 自动构建 APK 并上传到 Release；也可在 Actions 页面手动触发。
#
# 构建说明：Python 运行时已随仓库提供（CPython 3.13 for Android），由 AAPT 打进 APK，
# 因此**无需任何外部下载**，clone 后即可离线构建：
#   - app/src/main/assets/python-stdlib.zip          纯 Python 标准库
#   - app/src/main/jniLibs/arm64-v8a/libpython3.13.so 解释器本体
#   - app/src/main/jniLibs/arm64-v8a/libpybridge.so   JNI 桥
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify offline Python runtime is present
        # 构建前先确认 CPython 运行时资源在仓库中（否则打出的 APK 跑不了代码）
        run: |
          test -f app/src/main/assets/python-stdlib.zip \
            || { echo "::error::缺少 Python 标准库 app/src/main/assets/python-stdlib.zip"; exit 1; }
          for f in libpython3.13.so libpybridge.so; do
            test -f "app/src/main/jniLibs/arm64-v8a/$f" \
              || { echo "::error::缺少 Python 运行库 app/src/main/jniLibs/arm64-v8a/$f"; exit 1; }
          done
          echo "✅ 离线运行时资源齐备（CPython 3.13 + 标准库 + JNI 桥）"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/DevTerminal-${GITHUB_REF_NAME}-debug.apk"
          ls -lh dist/

      - name: Upload APK to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DevTerminal $GITHUB_REF_NAME" \
            --generate-notes \
            --latest || true
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          echo "APK uploaded to release $GITHUB_REF_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dev-terminal-apk
          path: dist/*.apk
          retention-days: 30