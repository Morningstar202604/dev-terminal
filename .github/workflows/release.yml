name: Release APK

# 推送 v* tag 自动构建 APK 并上传到 Release。
#
# 构建说明：Python 运行时（Pyodide / WebAssembly，约 13MB）已随仓库提供、
# 由 AAPT 打进 APK，因此**无需任何外部下载**，clone 后即可离线构建。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify offline Python runtime is present
        # 构建前先确认 Pyodide 资源在仓库中（否则打出的 APK 跑不了代码）
        run: |
          for f in pyodide.asm.wasm python_stdlib.zip pyodide.mjs; do
            test -f "app/src/main/assets/pyodide/$f" \
              || { echo "::error::缺少 Python 运行时资源 app/src/main/assets/pyodide/$f"; exit 1; }
          done
          test -f app/src/main/assets/python-runner.html
          echo "✅ 离线运行时资源齐备"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/DevTerminal-${GITHUB_REF_NAME}-debug.apk"
          ls -lh dist/

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "DevTerminal $GITHUB_REF_NAME" \
            --generate-notes \
            --latest || true
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          echo "APK uploaded to release $GITHUB_REF_NAME"
