<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>DevTerminal Python Runner</title>
<style>
  html, body { margin: 0; padding: 0; background: #1e1f22; }
</style>
</head>
<body>
<script type="module">
// DevTerminal 离线 Python 运行器（WebView 主线程版）
//
// 为什么不用 Web Worker：Android WebView 里 Worker + WASM + 模块脚本在部分
// 机型上加载不稳定，且 SharedArrayBuffer 需要 COOP/COEP 跨源隔离头，
// file:// 与 WebViewAssetLoader 下拿不到。改为在主线程跑，用 Pyodide 的
// setInterruptBuffer 做超时中断（无 SAB 时降级为看门狗 + 强制重载）。
import { loadPyodide } from './pyodide/pyodide.mjs';

let pyodide = null;
let interruptBuffer = null;
let hasSab = false;
let loading = null;
let running = false;
/** 预喂输入队列：pushInput 追加、stdin handler 消费 */
let inputQueue = [];

// ---- 与 Android 层的桥 ----
function bridge(name, payload) {
  try {
    if (window.DevTerminal && typeof window.DevTerminal[name] === 'function') {
      window.DevTerminal[name](payload || '');
    }
  } catch (_) { /* 桥未就绪时静默 */ }
}
const postOut   = (text, stream) => bridge('onOutput', JSON.stringify({ text, stream }));
const postState = (state, msg)  => bridge('onState',  JSON.stringify({ state, msg: msg || '' }));

// 清洗 Pyodide 注入的内部栈帧，否则会混进 traceback 并被「点击跳行」误判
function cleanTraceback(tb) {
  return tb.split('\n').filter((line) => {
    if (/_pyodide/.test(line)) return false;
    if (/python3\d+\.zip/.test(line)) return false;
    if (/^\s*await CodeRunner\(/.test(line)) return false;
    if (/^\s*coroutine = eval/.test(line)) return false;
    if (/^\s*\^+/.test(line)) return false;
    return true;
  }).join('\n');
}

async function ensure() {
  if (pyodide) return pyodide;
  if (loading) return loading;
  loading = (async () => {
    postState('loading', '正在加载离线 Python 解释器…');
    // indexURL 指向同目录下的 pyodide/，资源全部来自 APK assets，零网络
    pyodide = await loadPyodide({ indexURL: './pyodide/' });
    if (typeof SharedArrayBuffer !== 'undefined') {
      interruptBuffer = new Int32Array(new SharedArrayBuffer(4));
      pyodide.setInterruptBuffer(interruptBuffer);
      hasSab = true;
    } else {
      // Android WebView 拿不到 COOP/COEP 头，SAB 恒不可用；
      // 告知 Kotlin 侧走「销毁重建」强杀路径（见 PyodideEngine.hardKillAndFinish）
      hasSab = false;
    }
    postState('ready', hasSab ? 'sab' : 'nosab');
    return pyodide;
  })();
  try { return await loading; }
  finally { loading = null; }
}

/**
 * 运行一段 Python。
 * msg: { code, files:{name:content}, inputs:[...], mainFile, timeout }
 */
async function run(msg) {
  if (running) { postOut('⚠ 已有程序在运行中，请先停止', 'stderr'); return; }
  running = true;

  try {
    await ensure();
  } catch (err) {
    postOut('离线解释器加载失败：' + String(err), 'stderr');
    postState('failed', '解释器加载失败');
    running = false;
    bridge('onFinish', JSON.stringify({ exitCode: 1, durationMs: 0 }));
    return;
  }

  const { code, files, inputs, mainFile, timeout } = msg;
  const started = Date.now();
  // 预喂输入（run 参数），后续 input() 直接消费
  inputQueue.push(...(inputs || []));

  // ---- 写入真实文件到虚拟 FS，保证 import 能解析 ----
  try { pyodide.FS.mkdir('/workspace'); } catch (_) {}
  pyodide.FS.chdir('/workspace');
  for (const name of Object.keys(files || {})) {
    try { pyodide.FS.unlink('/workspace/' + name); } catch (_) {}
  }
  for (const name of Object.keys(files || {})) {
    try { pyodide.FS.writeFile('/workspace/' + name, files[name]); }
    catch (err) { postOut('写入 ' + name + ' 失败：' + String(err), 'stderr'); }
  }

  // ---- 整块捕获 stdout/stderr，流式 UTF-8 解码（官方 write handler，比 raw 逐字节高效）----
  const td = { stdout: new TextDecoder('utf-8'), stderr: new TextDecoder('utf-8') };
  const pending = { stdout: '', stderr: '' };
  const write = (stream) => (buf) => {
    pending[stream] += td[stream].decode(buf, { stream: true });
    let idx;
    while ((idx = pending[stream].indexOf('\n')) >= 0) {
      postOut(pending[stream].slice(0, idx), stream);
      pending[stream] = pending[stream].slice(idx + 1);
    }
    return buf.length;
  };
  pyodide.setStdout({ write: write('stdout') });
  pyodide.setStderr({ write: write('stderr') });

  // ---- 标准输入：预喂队列优先，队列空时弹输入框 ----
  // 用 Pyodide 官方 stdin handler（browser 默认行为即 window.prompt）。
  // Android WebView 的 JS 运行在独立线程，window.prompt 的同步等待不会卡 UI 主线程，
  // 因此 input() 是真正可用的交互输入，不再有忙等死锁。
  // 阶段 1 迁移 Chaquopy 后，本段将由「sys.stdin 队列 + 面板内联输入」替代。
  pyodide.setStdin({
    stdin: () => {
      if (inputQueue.length > 0) return inputQueue.shift();
      // 返回 null 表示 EOF（用户取消对话框），对应 Python 的 EOFError
      return window.prompt();
    },
    isatty: true
  });

  // ---- 超时看门狗：优先用中断缓冲（KeyboardInterrupt 取消，解释器保持温热）----
  // 在用户代码开跑前才启动：依赖装载（首次可能解包 20MB+ 的 wheel）不应吃掉用户超时。
  // 无 SAB 时 JS 事件循环会被死循环占死，这里只能留下状态提示，
  // 真正的强制终止由 Kotlin 侧看门狗（超时 +5s 后销毁 WebView 重建）兜底。
  const sec = timeout || 8;
  let killed = false;
  let watchdog = null;
  const armWatchdog = () => {
    watchdog = setTimeout(() => {
      killed = true;
      if (interruptBuffer) {
        interruptBuffer[0] = 2; // SIGINT
        postState('timeout', '执行超时，已请求中断');
      } else {
        postState('timeout', '执行超时，正在强制终止…');
      }
    }, sec * 1000);
  };

  let exitCode = 0;
  try {
    // setup：让同目录模块可被 import（之前整段 input 忙等实现已删除）
    await pyodide.runPythonAsync('import sys, os; sys.path.insert(0, os.getcwd())');
    // 按代码里的 import 自动装载预打包库（numpy/pandas 及其依赖）。
    // wheel 全部内置在 APK 的 indexURL 同目录下，零网络；装载失败不拦截，
    // 交给用户代码报出真实错误（例如 import 名与内置包不一致时）。
    try {
      await pyodide.loadPackagesFromImports(code);
    } catch (err) {
      postOut('内置依赖装载提示：' + String(err), 'stderr');
    }
    armWatchdog();
    await pyodide.runPythonAsync(code, { filename: mainFile || '<exec>' });
  } catch (err) {
    exitCode = 1;
    const rawMsg = (err && err.message) ? err.message : String(err);
    const tb = cleanTraceback(rawMsg);
    if (killed && /KeyboardInterrupt/.test(rawMsg)) {
      postOut('⏱ 已超时取消（' + sec + 's）：死循环被安全终止，应用未卡死', 'stderr');
    }
    for (const ln of tb.split('\n')) postOut(ln, 'stderr');
  } finally {
    if (watchdog) clearTimeout(watchdog);
    if (interruptBuffer) interruptBuffer[0] = 0; // 复位，避免影响下一次运行
  }

  if (pending.stdout) postOut(pending.stdout, 'stdout');
  if (pending.stderr) postOut(pending.stderr, 'stderr');

  running = false;
  postState('done', '');
  bridge('onFinish', JSON.stringify({ exitCode, durationMs: Date.now() - started }));
}

// ---- Android 侧调用入口 ----
window.DevTerminalBridge = {
  // 预加载解释器（首次进入编辑器时后台预热，用户点运行时不必干等）
  warmup() { ensure().catch((e) => postOut('预热失败：' + String(e), 'stderr')); },
  run(json) {
    let msg;
    try { msg = JSON.parse(json); }
    catch (e) { postOut('运行参数解析失败：' + String(e), 'stderr'); return; }
    run(msg);
  },
  stop() {
    if (interruptBuffer) {
      interruptBuffer[0] = 2; // 触发 KeyboardInterrupt
    } else {
      // 无 SAB：JS 无法安全中断（死循环时事件循环卡死），
      // 只留提示，强杀由 Kotlin 侧 hardKillAndFinish() 完成
      postState('stopping', '正在强制终止运行…');
    }
  },
  /**
   * 运行中追加一行输入到预喂队列（input() 尚未执行到时先缓存；
   * 阶段 0 的真实输入走 window.prompt 对话框，阶段 1 Chaquopy 后此入口恢复为面板输入）。
   */
  pushInput(text) {
    try {
      if (!pyodide) return;
      inputQueue.push(String(text));
    } catch (e) {
      postOut('输入写入失败：' + String(e), 'stderr');
    }
  }
};

postState('booted', '');
</script>
</body>
</html>
